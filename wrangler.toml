name = "smhi-mcp"
main = "worker.js"
compatibility_date = "2023-12-18"

# R2 configuration for CSV caching
[[r2_buckets]]
binding = "HISTORICAL_DATA"
bucket_name = "smhi-historical-data"

[vars]
# Comma-separated IPs refused with 403. Empty string = block nobody.
#
# 158.174.178.59 (Bahnhof, SE) ran an SSE reconnect loop that generated ~420k
# requests over 2026-08-13..16. The 405 fix on GET /mcp stopped the loop; this
# entry is defence in depth. Residential addresses are dynamic -- if this one
# is reassigned, clear this value and redeploy.
#
# NOTE: a 403 here is still a billed Worker request. This denies access; it
# does not save quota. See README, "Protecting the request quota".
BLOCKED_IPS = "158.174.178.59"

# Environment configuration
[env.production.vars]
# Add any public configuration variables here

# Optional: Uncomment if you want to add authentication
# [[env.production.secrets]]
# API_KEY = ""

# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true
